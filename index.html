<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marahoué Immo - Bouaflé</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f7f6; /* Blanc légèrement grisé pour le fond */
            margin: 0; 
            padding: 0; 
            text-align: center; 
        }
        header { 
            background-color: #ffffff; 
            padding: 30px 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        img.logo { 
            width: 120px; 
            border-radius: 20px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 { 
            color: #1b5e20; /* Vert profond et chaleureux */
            font-size: 26px; 
            margin-top: 15px; 
            margin-bottom: 5px;
        }
        p.subtitle { 
            color: #666; 
            font-size: 15px; 
            margin-top: 0;
            margin-bottom: 30px; 
        }
        .btn-container { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            padding: 40px 20px; 
        }
        .btn { 
            padding: 18px; 
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: bold; 
            text-decoration: none; 
            color: white; 
            border: none; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-louer { 
            background-color: #2E7D32; /* Vert de l'immobilier */
        }
        .btn-acheter { 
            background-color: #e65100; /* Orangé terre cuite / brique */
        }
    </style>
</head>
<body>

    <header>
        <img src="logo-512.png" alt="Logo Marahoué Immo" class="logo">
        <h1>Marahoué Immo</h1>
        <p class="subtitle">Votre chez-soi à Bouaflé et dans la Marahoué</p>
    </header>

    <main>
        <div class="btn-container">
            <a href="#" class="btn btn-louer">🏡 LOUER (Maisons, Magasins)</a>
            <a href="#" class="btn btn-acheter">🗺️ ACHETER (Terrains, Lots)</a>
        </div>
    </main>

</body>
</html>
